[project]
name = "medium-article-agent"
version = "0.1.0"
description = "Agentic Medium Article Generator — LangGraph editorial pipeline"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0.0",
    "PyMuPDF>=1.24.0",
    "python-pptx>=1.0.2",
    "beautifulsoup4>=4.12.0",
    "trafilatura>=1.12.0",
    "nbformat>=5.10.0",
    "sqlalchemy>=2.0.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langchain-core>=0.3.0",
    "openai>=1.54.0",
    "boto3>=1.35.0",
    "langsmith>=0.1.0",
    "sse-starlette>=2.1.0",
    "jinja2>=3.1.0",
    "markdown>=3.7",
    "httpx>=0.27.0",
    "lxml_html_clean>=0.4.0",
    "ddgs>=9.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
